AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Staging customer phone authentication preserving existing Cognito subjects
Resources:
  Sessions:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WizzUser_phone_auth_staging
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: staging
      MethodSettings: [{ResourcePath: '/*', HttpMethod: '*', ThrottlingBurstLimit: 10, ThrottlingRateLimit: 5}]
  Challenge:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: WizzUser-phone-challenge-staging
      CodeUri: phone-auth/
      Handler: triggers.handler
      Runtime: nodejs22.x
      Timeout: 10
      Environment:
        Variables:
          USER_POOL_ID: us-east-1_TpyyrVkEE
          OTP_TABLE: !Ref Sessions
          OTP_SECRET_ARN: arn:aws:secretsmanager:us-east-1:699561669180:secret:wizz/staging/otpiq-SB1iGZ
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Sessions}
        - Statement:
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: arn:aws:secretsmanager:us-east-1:699561669180:secret:wizz/staging/otpiq-SB1iGZ
  CognitoInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Challenge
      Principal: cognito-idp.amazonaws.com
      SourceAccount: '699561669180'
      SourceArn: arn:aws:cognito-idp:us-east-1:699561669180:userpool/us-east-1_TpyyrVkEE
  Auth:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: WizzUser-phone-auth-staging
      CodeUri: phone-auth/
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT: staging
          LEGAL_SETTINGS_TABLE: staging-PlatformStaff
          USER_POOL_ID: us-east-1_TpyyrVkEE
          CLIENT_ID: 4a9e8o3em311eq2rgckp0pd2s9
          USERS_TABLE: WizzUser_users_staging
          WALLETS_TABLE: staging-Wallets
          DELETION_TABLE: staging-AccountDeletion
          OTP_TABLE: !Ref Sessions
          OTP_SECRET_ARN: arn:aws:secretsmanager:us-east-1:699561669180:secret:wizz/staging/otpiq-SB1iGZ
      Policies:
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
            Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-PlatformStaff
            Condition:
              ForAllValues:StringEquals:
                dynamodb:LeadingKeys: ["OPERATIONAL_SETTINGS#CUSTOMER_LEGAL", "OPERATIONAL_SETTINGS#DRIVER_LEGAL", "OPERATIONAL_SETTINGS#MERCHANT_LEGAL"]
        - DynamoDBCrudPolicy: {TableName: !Ref Sessions}
        - Statement:
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: arn:aws:secretsmanager:us-east-1:699561669180:secret:wizz/staging/otpiq-SB1iGZ
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
            Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-AccountDeletion
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: ["ACCOUNT_LIFECYCLE#CUSTOMER#*"]
        - Statement:
            Effect: Allow
            Action: [cognito-idp:ListUsers, cognito-idp:AdminCreateUser, cognito-idp:AdminSetUserPassword, cognito-idp:AdminInitiateAuth, cognito-idp:AdminRespondToAuthChallenge]
            Resource: arn:aws:cognito-idp:us-east-1:699561669180:userpool/us-east-1_TpyyrVkEE
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem]
            Resource:
              - arn:aws:dynamodb:us-east-1:699561669180:table/WizzUser_users_staging
              - arn:aws:dynamodb:us-east-1:699561669180:table/WizzUser_users_staging/index/*
              - arn:aws:dynamodb:us-east-1:699561669180:table/staging-Wallets
      Events:
        LegalDocuments:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /legal, Method: GET}
        Send:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /auth/phone/send, Method: POST}
        Verify:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /auth/phone/verify, Method: POST}
Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/staging'
