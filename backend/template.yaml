  WebSocketSubscribeBusinessStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketAPI
      RouteKey: subscribe_business_status
      AuthorizationType: NONE
      OperationName: SubscribeBusinessStatusRoute
      Target: !Join 
