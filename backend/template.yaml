  WebSocketCleanupUserConnectionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/websocket-cleanup-user-connections/index.handler
      FunctionName: !Sub "WizzUser-WebSocketCleanupUserConnections-${Environment}"
      Description: "WebSocket cleanup function - Updated table references v2"
      Environment:
        Variables:
          WEBSOCKET_API_ID: !Ref WebSocketAPI
          WEBSOCKET_STAGE: !Ref Environment
          WEBSOCKET_CONNECTIONS_TABLE: !Sub "WizzUser_websocket_connections_${Environment}"
          WEBSOCKET_SUBSCRIPTIONS_TABLE: !Sub "WizzUser_websocket_subscriptions_${Environment}"
          WEBSOCKET_ENDPOINT: !Sub "https://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:Scan
              - dynamodb:BatchWriteItem
              - dynamodb:Query
              - dynamodb:DeleteItem
              - dynamodb:BatchDeleteItem
            Resource: 
              - !GetAtt WebSocketConnectionsTable.Arn
              - !Sub "${WebSocketConnectionsTable.Arn}/index/*"
              - !GetAtt WebSocketSubscriptionsTable.Arn
              - !Sub "${WebSocketSubscriptionsTable.Arn}/index/*"
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: 
              - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/*"
      Events:
        CleanupApi:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /websocket/cleanup-user-connections
            Method: post

  # Business Status Update Function - إرسال تحديثات حالة المطاعم عبر WebSocket
  BusinessStatusUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/business-status-update/index.handler
      FunctionName: !Sub "WizzUser-BusinessStatusUpdate-${Environment}"
      Environment:
        Variables:
          WEBSOCKET_TABLE: !Ref WebSocketConnectionsTable
          WEBSOCKET_ENDPOINT: !Sub "https://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
      Events:
        BusinessStatusUpdateApi:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /business-status-update
            Method: post
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: "*"

  # Business Stream Processor - معالجة تحديثات جدول المطاعم
  BusinessStreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/business-status-stream-handler/index.handler
      FunctionName: !Sub "WizzUser-BusinessStreamProcessor-${Environment}"
      Environment:
        Variables:
          WEBSOCKET_ENDPOINT: !Sub "https://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
          CONNECTIONS_TABLE: !Sub "WizzUser_websocket_connections_${Environment}"
          BUSINESSES_TABLE: WhizzMerchants_Businesses
          WORKING_HOURS_TABLE: WhizzMerchants_BusinessWorkingHours
      Events:
        BusinessesStream:
          Type: DynamoDB
          Properties:
            Stream: !ImportValue WhizzMerchants-Tables-staging-BusinessesStreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
              - execute-api:Invoke
            Resource: "*"
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Scan
              - dynamodb:DeleteItem
            Resource: 
              - !Sub "arn:aws:dynamodb:*:*:table/WizzUser_websocket_connections_${Environment}"
              - "arn:aws:dynamodb:*:*:table/WhizzMerchants_Businesses"
              - "arn:aws:dynamodb:*:*:table/WhizzMerchants_BusinessWorkingHours"

  WebSocketDefaultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/websocket-default/index.handler
      FunctionName: !Sub "WizzUser-WebSocketDefault-${Environment}"
      Environment:
        Variables:
          WEBSOCKET_CONNECTIONS_TABLE: !Sub "WizzUser_websocket_connections_${Environment}"
          WEBSOCKET_SUBSCRIPTIONS_TABLE: !Sub "WizzUser_websocket_subscriptions_${Environment}"
