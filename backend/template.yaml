        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

  # Guest Order Management Functions
  GetGuestOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/get-guest-orders/index.handler
      FunctionName: !Sub "WizzUser-GetGuestOrders-${Environment}"
      Environment:
        Variables:
          WIZZORDERS_TABLE: WizzOrders
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:GetItem
            Resource: 
              - arn:aws:dynamodb:*:*:table/WizzOrders
              - arn:aws:dynamodb:*:*:table/WizzOrders/index/*
      Events:
        GetGuestOrders:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /orders
            Method: get

  MergeGuestOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/merge-guest-orders/index.handler
      FunctionName: !Sub "WizzUser-MergeGuestOrders-${Environment}"
      Environment:
        Variables:
          WIZZORDERS_TABLE: WizzOrders
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:TransactWriteItems
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:GetItem
              - dynamodb:BatchWriteItem
            Resource: 
              - arn:aws:dynamodb:*:*:table/WizzOrders
              - arn:aws:dynamodb:*:*:table/WizzOrders/index/*
      Events:
        MergeGuestOrders:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /users/{user_id}/merge-guest
            Method: post

  RegisterGuestPushTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/register-guest-push-token/index.handler
      FunctionName: !Sub "WizzUser-RegisterGuestPushToken-${Environment}"
      Environment:
        Variables:
          CENTRAL_NOTIFICATIONS_BASE_URL: !Ref CentralNotificationsBaseUrl
          CENTRAL_NOTIFICATIONS_INTERNAL_KEY: !Ref CentralNotificationsInternalKey
      Events:
        RegisterGuestPushToken:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /push/tokens/register-guest
            Method: post

  # Driver Assignment Layer
  DriverAssignmentLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "driver-assignment-layer-${Environment}"
      Description: "Driver assignment system components"
      ContentUri: layers/driver-assignment/
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Delete

  # Driver Assignment API Function
  DriverAssignmentAPIFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/driver-assignment-api/index.handler
      FunctionName: !Sub "WizzUser-DriverAssignmentAPI-${Environment}"
      Layers:
        - !Ref DriverAssignmentLayer
      Environment:
        Variables:
          OFFERS_TABLE: !Sub "driver-assignment-offers-${Environment}"
          DRIVERS_TABLE: !Sub "driver-assignment-drivers-${Environment}"
          RESPONSES_TABLE: !Sub "driver-assignment-responses-${Environment}"
          WEBSOCKET_ENDPOINT: !Sub "wss://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
      Events:
        GetOffers:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /driver/{driverId}/offers
            Method: get
        RespondToOffer:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /driver/{driverId}/offers/respond
            Method: post
        UpdateDriverStatus:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /driver/{driverId}/status
            Method: put
        GetDriverStatus:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /driver/{driverId}/status
            Method: get
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/driver-assignment-offers-${Environment}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/driver-assignment-offers-${Environment}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/driver-assignment-drivers-${Environment}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/driver-assignment-drivers-${Environment}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/driver-assignment-responses-${Environment}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/driver-assignment-responses-${Environment}/index/*"
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
              - execute-api:POST
            Resource:
              - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/${Environment}/POST/@connections/*"

  # Manual Assignment Trigger Function
  ManualAssignmentTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/manual-assignment-trigger/index.handler
      FunctionName: !Sub "WizzUser-ManualAssignmentTrigger-${Environment}"
      Layers:
        - !Ref DriverAssignmentLayer
      Environment:
        Variables:
          ORDERS_TABLE: "WizzOrders"
          OFFERS_TABLE: !Sub "driver-assignment-offers-${Environment}"
          DRIVERS_TABLE: !Sub "driver-assignment-drivers-${Environment}"
          RESPONSES_TABLE: !Sub "driver-assignment-responses-${Environment}"
          WEBSOCKET_ENDPOINT: !Sub "wss://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
      Events:
        ManualTrigger:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /admin/trigger-assignment
            Method: post
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - arn:aws:dynamodb:*:*:table/WizzOrders
              - arn:aws:dynamodb:*:*:table/WizzOrders/index/*
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/driver-assignment-offers-${Environment}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/driver-assignment-offers-${Environment}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/driver-assignment-drivers-${Environment}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/driver-assignment-drivers-${Environment}/index/*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/driver-assignment-responses-${Environment}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/driver-assignment-responses-${Environment}/index/*"

  # Cognito User Pool
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "WizzUser-users-${Environment}"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
        - phone_number
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: phone_number
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: marketing_consent
          AttributeDataType: String
          Mutable: true
          Required: false

  # Cognito User Pool Client
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: !Sub "WizzUser-client-${Environment}"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # DynamoDB Tables - Essential User and App Data Tables
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WizzUser_users_${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: phone-index
          KeySchema:
            - AttributeName: phone
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TempUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WizzUser_temp_users_${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tempUserId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: tempUserId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: phone-index
          KeySchema:
            - AttributeName: phone
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  PasswordResetTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WizzUser_password_reset_tokens_${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: identifier
          AttributeType: S
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: identifier
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: token-index
          KeySchema:
            - AttributeName: token
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Addresses Table
  AddressesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WizzUser_addresses_${Environment}"
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: checkoutExpiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: addressId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: isDefault
          AttributeType: S
      KeySchema:
        - AttributeName: addressId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: userId-isDefault-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: isDefault
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ===== WALLET SYSTEM TABLES =====
  
  # Wallets Table for User Wallet Management
  WalletsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WizzUser_wallets_${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: walletId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: walletId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: Wallet

  # Favorites Table
  FavoritesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WizzUser_favorites_${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: favoriteId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: businessId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: favoriteId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-createdAt-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: userId-businessId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: businessId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: Favorites

  # Transactions Table for Wallet Transaction History
  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WizzUser_transactions_${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transactionId
          AttributeType: S
        - AttributeName: walletId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: transactionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: walletId-createdAt-index
          KeySchema:
            - AttributeName: walletId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: userId-createdAt-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: Wallet

  # WebSocket Tables - For Real-time Connection Management  
  WebSocketConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WizzUser_websocket_connections_${Environment}"
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: connectedAt
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-connectedAt-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: connectedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: WebSocket

  WebSocketSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WizzUser_websocket_subscriptions_${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subscriptionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: topic
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: subscriptionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-topic-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: topic
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: topic-createdAt-index
          KeySchema:
            - AttributeName: topic
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: WebSocket

  # ======================================================================
  # DEPRECATED: WizzOrdersTable - Now using shared WizzOrders table
  # This table definition is kept for reference but not deployed
  # The shared table is managed separately via WizzOrders-Table stack
  # ======================================================================
  # WizzOrdersTable:
  #   Type: AWS::DynamoDB::Table
  #   Properties:
  #     TableName: !Sub "WizzOrders_${Environment}"
  #     BillingMode: PAY_PER_REQUEST
  #     # ... (schema moved to shared table)

  # Business Tables - Using existing tables from order-receiver-infrastructure-dev stack
  # BusinessesTable: order-receiver-businesses-dev
  # CategoriesTable: order-receiver-categories-dev  
  # ProductsTable: order-receiver-products-dev

  # Lambda Functions
  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/health-check/index.handler
      FunctionName: !Sub "WizzUser-HealthCheck-${Environment}"
      Events:
        HealthCheckApi:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /health
            Method: get

  WizzUserRegistrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/user-registration/index.handler
      FunctionName: !Sub "WizzUser-UserRegistration-${Environment}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TempUsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminGetUser
                - cognito-idp:ListUsers
                - cognito-idp:SignUp
                - cognito-idp:ConfirmSignUp
              Resource: !GetAtt CognitoUserPool.Arn
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"

  WizzUserVerifyPhoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/verify-phone/index.handler
      FunctionName: !Sub "WizzUser-VerifyPhone-${Environment}"
