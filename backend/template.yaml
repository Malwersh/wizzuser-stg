  StoreAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "store-availability-${Environment}"
      CodeUri: src/functions/store-availability/
      Handler: index.handler
      Runtime: nodejs20.x
