          WEBSOCKET_TABLE: !Ref WebSocketConnectionsTable
          ENVIRONMENT: !Ref Environment
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource: 
              - arn:aws:dynamodb:*:*:table/WhizzMerchants_Businesses
              - arn:aws:dynamodb:*:*:table/WhizzMerchants_Businesses/index/*
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
