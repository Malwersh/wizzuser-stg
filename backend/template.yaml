              - dynamodb:Scan
            Resource: 
              - arn:aws:dynamodb:*:*:table/WizzOrders
              - arn:aws:dynamodb:*:*:table/WizzOrders/index/*
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /scheduling/slots/{businessId}
            Method: GET
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /scheduling/book/{businessId}
            Method: POST
      Tags:
        Service: WizzUser
        Purpose: OrderScheduling

  RealtimeAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "realtime-availability-${Environment}"
      CodeUri: src/functions/realtime-availability/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          AVAILABILITY_SUBSCRIPTIONS_TABLE: !Sub "order-receiver-availability-subscriptions-${Environment}"
          ENVIRONMENT: !Ref Environment
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Sub "order-receiver-availability-subscriptions-${Environment}"
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/*"
      Events:
        ConnectRoute:
          Type: Api
          Properties:
            Path: /realtime-availability
            Method: GET
            RestApiId: !Ref WizzUserFoodAppApi
        WebSocketConnect:
          Type: Api
          Properties:
            Path: $connect
            Method: ANY
            RestApiId: !Ref WebSocketAPI
        WebSocketDisconnect:
          Type: Api
          Properties:
            Path: $disconnect
            Method: ANY
            RestApiId: !Ref WebSocketAPI
        WebSocketSubscribe:
          Type: Api
          Properties:
            Path: subscribe
            Method: ANY
            RestApiId: !Ref WebSocketAPI
        WebSocketUnsubscribe:
          Type: Api
          Properties:
            Path: unsubscribe
            Method: ANY
            RestApiId: !Ref WebSocketAPI
        WebSocketPing:
          Type: Api
          Properties:
            Path: ping
            Method: ANY
            RestApiId: !Ref WebSocketAPI
      Tags:
        Service: WizzUser
        Purpose: RealtimeAvailability

  BusinessStatusAvailabilityTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "business-status-availability-trigger-${Environment}"
      CodeUri: src/functions/business-status-availability-trigger/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          BUSINESSES_TABLE: WhizzMerchants_Businesses
          ENVIRONMENT: !Ref Environment
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource: 
              - arn:aws:dynamodb:*:*:table/WhizzMerchants_Businesses
              - arn:aws:dynamodb:*:*:table/WhizzMerchants_Businesses/index/*
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable
      Events:
        # This function is triggered by DynamoDB streams from business tables
        # Stream triggers will be configured separately or via existing business stream handlers
        ManualTrigger:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /availability/trigger
            Method: POST
      Tags:
        Service: WizzUser
        Purpose: BusinessStatusAvailabilityTrigger

  # ==========================================
  # ADDITIONAL TABLES FOR AVAILABILITY SYSTEM
  # ==========================================
  
  AvailabilitySubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "order-receiver-availability-subscriptions-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subscriptionId
          AttributeType: S
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: subscriptionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ConnectionIdIndex
          KeySchema:
            - AttributeName: connectionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: WizzUser
        - Key: Purpose
          Value: AvailabilitySubscriptions

  # Enhanced Real-time Notification Functions
  UnifiedNotificationSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "WizzUser-UnifiedNotificationSender-${Environment}"
      CodeUri: src/functions/unified-notification-sender/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          WEBSOCKET_ENDPOINT: !Sub "https://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
          WEBSOCKET_TABLE: !Sub "WizzUser_websocket_connections_${Environment}"
          WIZZUSER_WEBSOCKET_ENDPOINT: !Sub "wss://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
          WIZZBUSINESS_WEBSOCKET_ENDPOINT: !Sub "wss://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
          WIZZUSER_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          WIZZBUSINESS_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WebSocketConnectionsTable
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:UpdateItem
            Resource: 
              - !Sub "arn:aws:dynamodb:*:*:table/WizzUser_websocket_connections_${Environment}"
              - !Sub "arn:aws:dynamodb:*:*:table/WizzUser_websocket_connections_${Environment}/index/*"
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource:
                - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/${Environment}/POST/@connections/*"
      Tags:
        Service: WizzUser
        Purpose: UnifiedNotifications

  EnhancedOrderStreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "WizzUser-EnhancedOrderStreamProcessor-${Environment}"
      CodeUri: src/functions/enhanced-order-stream-processor/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          UNIFIED_NOTIFICATION_FUNCTION: !Sub "WizzUser-UnifiedNotificationSender-${Environment}"
          WEBSOCKET_ENDPOINT: !Sub "https://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
          WEBSOCKET_TABLE: !Sub "WizzUser_websocket_connections_${Environment}"
          ORDERS_TABLE: WizzOrders
          ENVIRONMENT: !Ref Environment
      Events:
        OrdersStream:
          Type: DynamoDB
          Properties:
            Stream: !ImportValue WizzOrders-Table-staging-StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Sub "WizzUser-UnifiedNotificationSender-${Environment}"
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:ListStreams
              Resource: !ImportValue WizzOrders-Table-staging-StreamArn
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzUser_websocket_connections_${Environment}*"
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
                - execute-api:Invoke
              Resource: 
                - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/*"
                - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/${Environment}/POST/@connections/*"
      Tags:
        Service: WizzUser
        Purpose: OrderStreamProcessing

  OrderStreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "WizzUser-OrderStreamProcessor-${Environment}"
      CodeUri: src/functions/order-stream-processor/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          WEBSOCKET_ENDPOINT: !Sub "https://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
          WEBSOCKET_TABLE: !Ref WebSocketConnectionsTable
          ORDERS_TABLE: WizzOrders
          ENVIRONMENT: !Ref Environment
          CENTRAL_NOTIFICATIONS_BASE_URL: !Ref CentralNotificationsBaseUrl
          CENTRAL_NOTIFICATIONS_INTERNAL_KEY: !Ref CentralNotificationsInternalKey
      Events:
        OrdersStream:
          Type: DynamoDB
          Properties:
            Stream: !ImportValue WizzOrders-Table-staging-StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:ListStreams
              Resource: !ImportValue WizzOrders-Table-staging-StreamArn
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: 
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzUser_websocket_connections_${Environment}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzUser_websocket_connections_${Environment}/index/*"
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/*"
      Tags:
        Service: WizzUser
        Purpose: OrderStreamProcessing

  MerchantOrderStatusUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "WizzUser-MerchantOrderStatusUpdate-${Environment}"
      CodeUri: src/functions/merchant-order-status-update/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          WIZZORDERS_TABLE: WizzOrders
          UNIFIED_NOTIFICATION_FUNCTION: !Sub "WizzUser-UnifiedNotificationSender-${Environment}"
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource: 
              - arn:aws:dynamodb:*:*:table/WizzOrders
              - arn:aws:dynamodb:*:*:table/WizzOrders/index/*
        - LambdaInvokePolicy:
            FunctionName: !Sub "WizzUser-UnifiedNotificationSender-${Environment}"
      Events:
        MerchantUpdateStatus:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /merchant/order/{orderId}/status
            Method: PUT
      Tags:
        Service: WizzUser
        Purpose: MerchantOrderStatusUpdate

  WizzUserGetBusinessesStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "WizzUser-GetBusinessesStatus-${Environment}"
      CodeUri: src/
      Handler: functions/get-businesses-status/index.handler
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          BUSINESSES_TABLE: "WhizzMerchants_Businesses"
          WORKING_HOURS_TABLE: "WhizzMerchants_BusinessWorkingHours"
          DEFAULT_TIMEZONE: "Asia/Baghdad"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - arn:aws:dynamodb:*:*:table/WhizzMerchants_Businesses
                - arn:aws:dynamodb:*:*:table/WhizzMerchants_BusinessWorkingHours
                - arn:aws:dynamodb:*:*:table/WhizzMerchants_BusinessWorkingHours/index/*
      Tags:
        Service: WizzUser
        Purpose: BusinessesBatchStatus

Outputs:
  WizzUserApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${WizzUserFoodAppApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  WebSocketUrl:
    Description: "WebSocket API endpoint URL"
    Value: !Sub "wss://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-WebSocketUrl"
  
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"
  
  UserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"
