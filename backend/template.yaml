  # Order Management Functions
  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      MemorySize: 512
      CodeUri: src/
      Handler: functions/create-order/index.handler
      FunctionName: !Sub "WizzUser-CreateOrder-${Environment}"
      Environment:
        Variables:
          POINT_INVOICE_ENABLED: !If [IsPointInvoice321, 'true', 'false']
          MAPBOX_SECRET_ARN: !Ref PointInvoiceMapboxSecretArn
          BUSINESSES_TABLE: WhizzMerchants_Businesses
          # Enable only with Quote API, quoted checkout, customer deletion and scoped IAM.
          DELIVERY_QUOTE_MODE: 'OFF'
          COMMERCIAL_PRICING_MODE: !If [IsCommercialStaging, REQUIRED, 'OFF']
          CASH_ROUNDING_POLICY_MODE: !If [IsCommercialStaging, REQUIRED, 'OFF']
          # Use shared WizzUser WebSocket infrastructure for merchant notifications
          WEBSOCKET_CONNECTIONS_TABLE: !Sub "WizzUser_websocket_connections_${Environment}"
          WEBSOCKET_ENDPOINT: !Sub "wss://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
          MERCHANT_WEBHOOK_URL: !Ref MerchantWebhookUrl
          CENTRAL_NOTIFICATIONS_BASE_URL: !Ref CentralNotificationsBaseUrl
          CENTRAL_NOTIFICATIONS_INTERNAL_KEY: !Ref CentralNotificationsInternalKey
      Policies:
        - !If
          - IsPointInvoice321
          - Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Ref PointInvoiceMapboxSecretArn
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_RegionsDerived_${Environment}"
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-AccountDeletion"
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["BUSINESS_LIFECYCLE#MERCHANT#*", "ACCOUNT_LIFECYCLE#MERCHANT#*"]
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_RegionIndex_${Environment}/index/h3-index"
          - !Ref AWS::NoValue
        - !If
          - IsCommercialStaging
          - Statement:
              - Sid: ReadCommercialAgreementSources
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
                Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-MerchantPlatform
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['COMMERCIAL_AGREEMENT#*', 'PERSON#*', 'BRANCH#*']
              - Sid: ReadCommercialApprovals
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
                Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-PlatformStaff
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['COMMERCIAL_AGREEMENT#*', 'DISCOUNT_FUNDING#*']
              - Sid: ReadCommercialRegions
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
                Resource: arn:aws:dynamodb:us-east-1:699561669180:table/WizzCentral_Regions
              - Sid: ReservePlatformPromotionFunds
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-Wallets
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: ['WALLET#PLATFORM']
              - Sid: PlatformPromotionLedger
                Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-LedgerEntries
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: ['WALLET#PLATFORM']
              - Sid: PlatformPromotionReservationAndAudit
                Effect: Allow
                Action: [dynamodb:PutItem]
                Resource:
                  - arn:aws:dynamodb:us-east-1:699561669180:table/staging-Holds
                  - arn:aws:dynamodb:us-east-1:699561669180:table/staging-AuditLog
          - !Ref 'AWS::NoValue'
        - Statement:
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Products"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_Categories"
        - !If
          - IsQuoteStaging
          - Statement:
              - Sid: ConsumeDeliveryQuote
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
                Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-DeliveryQuotes
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['CUSTOMER#*']
              - Sid: DeliveryQuoteCustomerGuard
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
                Resource: arn:aws:dynamodb:us-east-1:699561669180:table/WizzUser_users_staging
              - Sid: DeliveryQuoteReferenceFences
                Effect: Allow
                Action: [dynamodb:ConditionCheckItem]
                Resource:
                  - arn:aws:dynamodb:us-east-1:699561669180:table/WizzUser_addresses_staging
                  - arn:aws:dynamodb:us-east-1:699561669180:table/WhizzMerchants_Businesses
                  - arn:aws:dynamodb:us-east-1:699561669180:table/staging-MerchantPlatform
                  - arn:aws:dynamodb:us-east-1:699561669180:table/staging-AccountDeletion
                  - arn:aws:dynamodb:us-east-1:699561669180:table/WizzCentral_Regions
                  - arn:aws:dynamodb:us-east-1:699561669180:table/WizzCentral_RegionsDerived_staging
              - Sid: CashRoundingPolicyFence
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
                Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-PlatformStaff
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: [OPERATIONAL_SETTINGS#CASH_ROUNDING]
              - Sid: DeliveryQuotePolicyFence
                Effect: Allow
                Action: [dynamodb:ConditionCheckItem]
                Resource: arn:aws:dynamodb:us-east-1:699561669180:table/staging-PlatformStaff
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: [OPERATIONAL_SETTINGS#DELIVERY_PRICING]
          - !Ref 'AWS::NoValue'
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:ConditionCheckItem
            Resource: !GetAtt UsersTable.Arn
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource: 
              - arn:aws:dynamodb:*:*:table/WizzOrders
              - arn:aws:dynamodb:*:*:table/WizzOrders/index/*
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource: 
              - arn:aws:dynamodb:*:*:table/WhizzMerchants_Businesses
              - arn:aws:dynamodb:*:*:table/WhizzMerchants_Businesses/index/*
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource:
              - arn:aws:dynamodb:*:*:table/WhizzMerchants_Discounts
              - arn:aws:dynamodb:*:*:table/WhizzMerchants_Discounts/index/*
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_Platform_Discounts"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzCentral_Platform_Discounts/index/*"
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:UpdateItem
            Resource: 
              - !Sub "arn:aws:dynamodb:*:*:table/WizzUser_websocket_connections_${Environment}"
              - !Sub "arn:aws:dynamodb:*:*:table/WizzUser_websocket_connections_${Environment}/index/*"
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
              - execute-api:Invoke
            Resource:
              - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/${Environment}/POST/@connections/*"
              - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/${Environment}/*/@connections/*"
              - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/*"

