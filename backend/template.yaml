AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Food App Backend - AWS Serverless Application with Distance Support and WebSocket
  Cognito + DynamoDB + Lambda + API Gateway + SNS + SES + WebSocket

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [dev, staging, prod]
    Description: Environment name

  EnablePointInvoice321:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Authenticated read-only point invoice; requires explicit routing permission approval.
  PointInvoiceMapboxSecretArn:
    Type: String
    Default: ''
    Description: Existing server-side routing secret ARN; never a client key.

  EnableCommercialPricing:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Staging commercial writer; requires coordinated Quote activation and approved source records.

  EnableFinancialCustomerCancellation:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Requires reviewed financial cancellation permissions.

  CentralNotificationsBaseUrl:
    Type: String
    Default: "https://x066k4dftk.execute-api.us-east-1.amazonaws.com/staging"
    Description: Base URL for CentralPlatform notifications API (used to send push order updates)

  CentralNotificationsInternalKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Internal key for CentralPlatform notifications API (sent as x-internal-key)

  MerchantWebhookUrl:
    Type: String
    Default: "https://ie7z8r4wc0.execute-api.us-east-1.amazonaws.com/staging/webhooks/orders"
    Description: Merchants webhook URL for order notifications (order-receiver-regional API, /webhooks/orders)

  OrderServiceUrl:
    Type: String
    Default: "https://mqwom78d3c.execute-api.us-east-1.amazonaws.com/staging"
    Description: Base URL for Order Service API Gateway (used for cancel/unassign)

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        USERS_TABLE: !Ref UsersTable
        TEMP_USERS_TABLE: !Ref TempUsersTable
        PASSWORD_RESET_TOKENS_TABLE: !Ref PasswordResetTokensTable
        ADDRESSES_TABLE: !Ref AddressesTable
        WALLETS_TABLE: !Ref WalletsTable
        TRANSACTIONS_TABLE: !Ref TransactionsTable
        WIZZORDERS_TABLE: WizzOrders
        DISCOUNTS_TABLE: WhizzMerchants_Discounts
        PLATFORM_DISCOUNTS_TABLE: WizzCentral_Platform_Discounts
        USER_POOL_ID: !Ref CognitoUserPool
        USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
        SES_FROM_EMAIL: noreply@foodapp.com

Conditions:
  IsPointInvoice321: !And
    - !Condition IsCommercialStaging
    - !Equals [!Ref EnablePointInvoice321, 'true']
    - !Not [!Equals [!Ref PointInvoiceMapboxSecretArn, '']]
  IsQuoteStaging: !And
    - !Equals [!Ref Environment, staging]
    - !Equals [!Ref 'AWS::AccountId', '699561669180']
    - !Equals [!Ref 'AWS::Region', us-east-1]
  IsCommercialStaging: !And [!Condition IsQuoteStaging, !Equals [!Ref EnableCommercialPricing, 'true']]

  IsFinancialCustomerCancellation: !And [!Condition IsCommercialStaging, !Equals [!Ref EnableFinancialCustomerCancellation, 'true']]

Resources:
  # API Gateway
  WizzUserFoodAppApi:
    Type: AWS::Serverless::Api
    Properties:
      # Delivery quotes and preview belong to the dedicated staging quote stack.
      Mode: merge
      StageName: !Ref Environment
      Name: !Sub "WizzUser-API-${Environment}"
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Customer-Id,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      DefinitionBody:
        swagger: "2.0"
        info:
          title: WizzUser Food App API
          version: "1.0"
        securityDefinitions:
          CognitoAuthorizer:
            type: apiKey
            name: Authorization
            in: header
            x-amazon-apigateway-authtype: cognito_user_pools
            x-amazon-apigateway-authorizer:
              type: cognito_user_pools
              providerARNs:
                - !GetAtt CognitoUserPool.Arn
        paths:
          /health:
            get:
              security: []
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HealthCheckFunction.Arn}/invocations"
              responses:
                "200":
                  description: "200 response"
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                    Access-Control-Allow-Headers:
                      type: string
                    Access-Control-Allow-Methods:
                      type: string
            options:
              security: []
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  "200":
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent'"
                      method.response.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: ''
              responses:
                "200":
                  description: "200 response"
                  headers:
                    Access-Control-Allow-Origin:
