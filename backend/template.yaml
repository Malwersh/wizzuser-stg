  # Working Hours Stream Handler Function
  WorkingHoursStreamHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/working-hours-stream-handler/
      Handler: index.handler
      FunctionName: !Sub "WizzUser-WorkingHoursStreamHandler-${Environment}"
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          WORKING_HOURS_TABLE: WhizzMerchants_BusinessWorkingHours
          WEBSOCKET_ENDPOINT: !Sub "https://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
      Events:
        WorkingHoursStream:
          Type: DynamoDB
          Properties:
            Stream: !ImportValue WhizzMerchants-Tables-staging-BusinessWorkingHoursStreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:ListStreams
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhizzMerchants_BusinessWorkingHours/stream/*"
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/*"
      Tags:
        Service: WizzMerchants
        Purpose: WorkingHours

  # ==========================================
  # AVAILABILITY SYSTEM FUNCTIONS
