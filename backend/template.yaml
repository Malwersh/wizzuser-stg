            Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/*"
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource: 
              - !GetAtt WebSocketConnectionsTable.Arn
              - !GetAtt WebSocketSubscriptionsTable.Arn

  # WebSocket Heartbeat Function - معالجة رسائل heartbeat من التطبيقات
  WebSocketHeartbeatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/websocket-heartbeat/index.handler
      FunctionName: !Sub "WizzUser-WebSocketHeartbeat-${Environment}"
      Description: "Processes heartbeat messages from all apps (customer, merchant, driver)"
      Environment:
        Variables:
          WEBSOCKET_CONNECTIONS_TABLE: !Sub "WizzUser_websocket_connections_${Environment}"
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/*"
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource: 
              - !GetAtt WebSocketConnectionsTable.Arn
              - !Sub "${WebSocketConnectionsTable.Arn}/index/*"

  # WebSocket API and Resources
  WebSocketAPI:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "WizzUser-WebSocket-${Environment}"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketAPI
      RouteKey: $connect
      AuthorizationType: NONE
      OperationName: ConnectRoute
      Target: !Join 
        - '/'
        - - 'integrations'
          - !Ref WebSocketConnectInteg

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketAPI
      RouteKey: $disconnect
      AuthorizationType: NONE
      OperationName: DisconnectRoute
      Target: !Join 
        - '/'
        - - 'integrations'
          - !Ref WebSocketDisconnectInteg

  WebSocketDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketAPI
      RouteKey: $default
      AuthorizationType: NONE
      OperationName: DefaultRoute
      Target: !Join 
        - '/'
        - - 'integrations'
          - !Ref WebSocketDefaultInteg

  WebSocketSubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketAPI
      RouteKey: subscribe_order
      AuthorizationType: NONE
      OperationName: SubscribeRoute
      Target: !Join 
        - '/'
        - - 'integrations'
          - !Ref WebSocketDefaultInteg

  WebSocketUnsubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketAPI
      RouteKey: unsubscribe_order
      AuthorizationType: NONE
      OperationName: UnsubscribeRoute
      Target: !Join 
        - '/'
        - - 'integrations'
          - !Ref WebSocketDefaultInteg

  WebSocketHeartbeatRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketAPI
      RouteKey: heartbeat
      AuthorizationType: NONE
      OperationName: HeartbeatRoute
      Target: !Join 
        - '/'
        - - 'integrations'
          - !Ref WebSocketHeartbeatInteg

