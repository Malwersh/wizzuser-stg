  # ===== WIZZUSER WALLET SYSTEM FUNCTIONS =====
  
  # Wallet Initialization Function
  WizzUserWalletInitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "WizzUser_wallet-init-${Environment}"
      CodeUri: src/
      Handler: functions/wallet-init/index.handler
      Runtime: nodejs20.x
      Environment:
        Variables:
          WALLETS_TABLE: !Ref WalletsTable
          TRANSACTIONS_TABLE: !Ref TransactionsTable
      Policies:
        - Statement:
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
            Resource: !GetAtt UsersTable.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref WalletsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
      Events:
        WalletInitApi:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /wallet/init
            Method: post

  # Wallet Balance Function
  WizzUserWalletBalanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "WizzUser_wallet-balance-${Environment}"
      CodeUri: src/functions/wallet-balance/
      Handler: index.handler
      Runtime: nodejs20.x
      Environment:
        Variables:
          WALLETS_TABLE: !Ref WalletsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WalletsTable
      Events:
        WalletBalanceApi:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /wallet/balance
            Method: get

  # Wallet TopUp Function
  WizzUserWalletTopUpFunction:
    Type: AWS::Serverless::Function
    Properties:
