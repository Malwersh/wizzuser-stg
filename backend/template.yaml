  # WebSocket Functions
  BusinessStatusBroadcastFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/business-status-broadcast/index.handler
      FunctionName: !Sub "WizzUser-BusinessStatusBroadcast-${Environment}"
      Environment:
        Variables:
          WEBSOCKET_ENDPOINT: !Sub "https://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
      Events:
        BusinessStatusBroadcastAPI:
          Type: Api
          Properties:
            RestApiId: !Ref WizzUserFoodAppApi
            Path: /business-status/broadcast
            Method: post
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:Scan
              - dynamodb:DeleteItem
            Resource: 
              - !GetAtt WebSocketConnectionsTable.Arn
              - !GetAtt WebSocketSubscriptionsTable.Arn
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: 
              - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/*"

  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/websocket-connect/index.handler
      FunctionName: !Sub "WizzUser-WebSocketConnect-${Environment}"
      Environment:
        Variables:
          WEBSOCKET_API_ID: !Ref WebSocketAPI
          WEBSOCKET_STAGE: !Ref Environment
          WEBSOCKET_TABLE: !Ref WebSocketConnectionsTable
          WEBSOCKET_CONNECTIONS_TABLE: !Sub "WizzUser_websocket_connections_${Environment}"
          WEBSOCKET_SUBSCRIPTIONS_TABLE: !Sub "WizzUser_websocket_subscriptions_${Environment}"
          DRIVER_LIVE_STATE_TABLE: !Sub "WizzDriverLiveState_${Environment}"
      Policies:
        - Statement:
          - Effect: Allow
            Action: [cognito-idp:AdminGetUser]
            Resource:
              - arn:aws:cognito-idp:us-east-1:699561669180:userpool/us-east-1_TpyyrVkEE
              - arn:aws:cognito-idp:us-east-1:699561669180:userpool/us-east-1_RGTqUXF5C
              - arn:aws:cognito-idp:us-east-1:699561669180:userpool/us-east-1_gtCR3ndzT
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
            Resource:
              - arn:aws:dynamodb:us-east-1:699561669180:table/staging-AccountDeletion
              - arn:aws:dynamodb:us-east-1:699561669180:table/WhizzMerchants_Businesses
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:DescribeTable
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:Scan
              - dynamodb:DeleteItem
              - dynamodb:BatchWriteItem
              - dynamodb:Query
            Resource: 
              - !GetAtt WebSocketConnectionsTable.Arn
              - !GetAtt WebSocketSubscriptionsTable.Arn
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
            Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzDriverLiveState_${Environment}"

  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/websocket-disconnect/index.handler
      FunctionName: !Sub "WizzUser-WebSocketDisconnect-${Environment}"
      Environment:
        Variables:
          WEBSOCKET_API_ID: !Ref WebSocketAPI
          WEBSOCKET_STAGE: !Ref Environment
          WEBSOCKET_TABLE: !Ref WebSocketConnectionsTable
          WEBSOCKET_CONNECTIONS_TABLE: !Sub "WizzUser_websocket_connections_${Environment}"
          WEBSOCKET_SUBSCRIPTIONS_TABLE: !Sub "WizzUser_websocket_subscriptions_${Environment}"
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:DescribeTable
              - dynamodb:DeleteItem
              - dynamodb:GetItem
              - dynamodb:BatchWriteItem
              - dynamodb:Scan
            Resource: 
              - !GetAtt WebSocketConnectionsTable.Arn
              - !GetAtt WebSocketSubscriptionsTable.Arn

  WebSocketConnectionsStreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: websocket_connection_stream_processor.handler
      FunctionName: !Sub "WizzUser-WebSocketConnectionsStreamProcessor-${Environment}"
      Timeout: 30
      Environment:
        Variables:
          WEBSOCKET_STAGE: !Ref Environment
          DRIVER_LIVE_STATE_TABLE: !Sub "WizzDriverLiveState_${Environment}"
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
            Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WizzDriverLiveState_${Environment}"
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:DescribeStream
              - dynamodb:GetRecords
              - dynamodb:GetShardIterator
            Resource: !GetAtt WebSocketConnectionsTable.StreamArn
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:ListStreams
            Resource: "*"
    Events:
      WebSocketConnectionsDdbStream:
        Type: DynamoDB
        Properties:
          Stream: !GetAtt WebSocketConnectionsTable.StreamArn
          StartingPosition: LATEST
          BatchSize: 100
          MaximumBatchingWindowInSeconds: 1

  WebSocketSendUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/websocket-send-update/index.handler
      FunctionName: !Sub "WizzUser-WebSocketSendUpdate-${Environment}"
      Environment:
        Variables:
          WEBSOCKET_ENDPOINT: !Sub "https://${WebSocketAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
          WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          WEBSOCKET_SUBSCRIPTIONS_TABLE: !Ref WebSocketSubscriptionsTable
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:DeleteItem
              - dynamodb:Scan
            Resource: 
              - !GetAtt WebSocketConnectionsTable.Arn
              - !Sub "${WebSocketConnectionsTable.Arn}/index/*"
              - !GetAtt WebSocketSubscriptionsTable.Arn
              - !Sub "${WebSocketSubscriptionsTable.Arn}/index/*"
              # Explicit permission for GSI1 index
              - !Sub "arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/WizzUser_websocket_connections_${Environment}/index/GSI1"
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: 
              - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketAPI}/*"

  # WebSocket Cleanup Function for Logout
  WebSocketCleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions/websocket-cleanup/index.handler
      FunctionName: !Sub "WizzUser-WebSocketCleanup-${Environment}"
      Environment:
        Variables:
          WEBSOCKET_API_ID: !Ref WebSocketAPI
          WEBSOCKET_STAGE: !Ref Environment
          WEBSOCKET_CONNECTIONS_TABLE: !Sub "WizzUser_websocket_connections_${Environment}"
          WEBSOCKET_SUBSCRIPTIONS_TABLE: !Sub "WizzUser_websocket_subscriptions_${Environment}"
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:Scan
              - dynamodb:DeleteItem
              - dynamodb:Query
            Resource: 
              - !GetAtt WebSocketConnectionsTable.Arn
              - !GetAtt WebSocketSubscriptionsTable.Arn

