AWSTemplateFormatVersion: '2010-09-09'
Description: 'Staging read-only point preview cost protection. Existing order/quote authorization remains unchanged.'
Parameters:
  QuoteRoleName:
    Type: String
  ApiId:
    Type: String
    Default: 4jut6787c8
  ParentResourceId:
    Type: String
  QuoteFunctionArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:699561669180:function:WizzUser-DeliveryQuotes-staging
Resources:
  PointPreviewRate:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: staging-StorefrontPointPreviewRate
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true
  PointPreviewRatePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PublicPointPreview317
      Roles: [!Ref QuoteRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem]
            Resource: !GetAtt PointPreviewRate.Arn
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: ['PUBLIC_POINT_PREVIEW#*']
  PointResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiId
      ParentId: !Ref ParentResourceId
      PathPart: storefront-point-preview
  PointPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiId
      ResourceId: !Ref PointResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${QuoteFunctionArn}/invocations'
  PointOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiId
      ResourceId: !Ref PointResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode":200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true
  PointInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QuoteFunctionArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/storefront-point-preview'
